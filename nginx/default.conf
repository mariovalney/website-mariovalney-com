# Serves the exported site. The whole nginx/ directory is copied to /etc/nginx/conf.d/ in the
# runtime image: nginx includes *.conf from there on its own, and reads the .map files through the
# includes below, which the *.conf glob ignores.

# The addresses the old blog published. A map is the cheap lookup for a list this size, and it has
# to sit here in http context rather than inside the server block. Each list is a separate file so
# scripts/preview.mjs can read exactly what nginx reads; see nginx/legacy-redirects.map.
# The longest key here is 107 characters, past the 64 byte default, and nginx refuses to build the
# hash rather than truncating: without this the server does not start at all.
map_hash_bucket_size 256;

map $uri $legacy_gone {
    default "";
    include /etc/nginx/conf.d/legacy-gone.map;
}

map $uri $legacy_redirect {
    default "";
    include /etc/nginx/conf.d/legacy-redirects.map;
}

map $uri $legacy_pattern {
    default "";
    include /etc/nginx/conf.d/legacy-patterns.map;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The proxy in front (Easypanel/Traefik) terminates TLS, so redirects must keep the original
    # host and scheme instead of rebuilding an absolute URL from this server's own name.
    absolute_redirect off;

    # Security headers are declared once, here. `add_header` inside a location would replace the
    # inherited set for that location, so the blocks below use `expires` only.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # One canonical address per page: /sobre/ redirects to /sobre. This runs in the rewrite phase,
    # before the lookups below, which is why every key in the .map files is written without a
    # trailing slash. An old link ending in one costs two hops and lands in the same place.
    rewrite ^/(.+)/$ /$1 permanent;

    # The old blog, archived at legacy.valney.dev. Exact addresses first, so /categorias/android
    # reaches its alias instead of being caught by the generic category pattern. `if` in server
    # context holding nothing but a `return` is the safe use of the directive.
    if ($legacy_gone) {
        return 410;
    }

    if ($legacy_redirect) {
        return 301 $legacy_redirect;
    }

    if ($legacy_pattern) {
        return 301 $legacy_pattern;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Default for everything, HTML included: revalidate on each request, or a deploy takes a hard
    # refresh to show up. `try_files` serves /sobre from sobre.html inside the location below
    # without rematching, so the rule has to live here, at server level, to reach it.
    expires -1;

    # Build assets carry a content hash in the filename, so they can be cached forever.
    # `^~` stops the regex location below from taking precedence over this one.
    location ^~ /_next/static/ {
        expires 1y;
    }

    # Images and fonts: cached for a day, since their names do not change.
    #
    # `.txt` and `.xml` are deliberately absent. The App Router exports its navigation payloads
    # as .txt files next to the HTML (index.txt, sobre.txt, __next.*.txt), and a cached payload
    # outlives the deploy it belongs to: a returning visitor navigates client-side and gets the
    # previous build's content, or a reference to a chunk hash that no longer exists. They fall
    # back to `expires -1` above, like the HTML. sitemap.xml and robots.txt cost nothing to
    # revalidate.
    location ~* \.(png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        expires 1d;
    }

    location / {
        # /sobre -> sobre.html, /docs -> docs/index.html, anything else -> the 404 page below.
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
